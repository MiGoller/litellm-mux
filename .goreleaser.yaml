version: 2

project_name: litellm-mux

builds:
  - id: litellm-mux
    main: ./cmd/litellm-mux/main.go
    binary: litellm-mux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/MiGoller/litellm-mux/cmd.version={{.Version}} -X github.com/MiGoller/litellm-mux/cmd.commit={{.Commit}} -X github.com/MiGoller/litellm-mux/cmd.date={{.Date}}

archives:
  - id: default
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
